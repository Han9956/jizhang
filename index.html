  /** 选一张收款码图片，缩到 400px 内再存（省空间） */
  function pickQR() {
    var input = document.createElement('input');
    input.type = 'file';
    input.accept = 'image/*';
    input.addEventListener('change', function () {
      var f = input.files && input.files[0];
      if (!f) return;
      var reader = new FileReader();
      reader.onload = function () {
        var img = new Image();
        img.onload = function () {
          var max = 400;
          var s = Math.min(1, max / Math.max(img.width, img.height));
          var c = document.createElement('canvas');
          c.width = Math.max(1, Math.round(img.width * s));
          c.height = Math.max(1, Math.round(img.height * s));
          var cx = c.getContext('2d');
          cx.fillStyle = '#fff';
          cx.fillRect(0, 0, c.width, c.height);
          cx.drawImage(img, 0, 0, c.width, c.height);
          db.settings.qr = c.toDataURL('image/png');
          if (!S.saveStorage(db)) {
            db.settings.qr = '';
            toast('图片太大，保存失败，换一张小一点的');
            return;
          }
          if ($('#qrBox')) $('#qrBox').innerHTML = qrBoxHTML();
          toast('收款码已保存');
        };
        img.onerror = function () { toast('这张图片读不出来'); };
        img.src = reader.result;
      };
      reader.readAsDataURL(f);
    });
    input.click();
  }

  /* ================= 事件 ================= */

  document.addEventListener('click', function (e) {
    var el = e.target.closest ? e.target.closest('[data-act]') : null;
    if (!el) return;
    var act = el.getAttribute('data-act');
    var id = el.getAttribute('data-id') || '';
    var kind = el.getAttribute('data-kind') || '';

    switch (act) {
      case 'tab': go(el.getAttribute('data-tab')); break;
      case 'go-parties': go('parties'); break;
      case 'close-sheet': closeSheet(); break;

      case 'quick-add':
        openSheet({
          title: '记一笔',
          body: '<div class="quick-menu">' +
            '<button class="qm-btn" data-act="new-sale"><span class="qb-ic" style="background:var(--green-soft);color:var(--green)">' + icon('plus') + '</span><b>卖货</b><small>卖给客户，可赊账</small></button>' +
            '<button class="qm-btn" data-act="new-purchase"><span class="qb-ic" style="background:var(--orange-soft);color:var(--orange)">' + icon('download') + '</span><b>进货</b><small>从供货商拉货</small></button>' +
            '<button class="qm-btn" data-act="new-receipt"><span class="qb-ic" style="background:var(--blue-soft);color:var(--blue)">' + icon('upload') + '</span><b>收欠款</b><small>客户还钱了</small></button>' +
            '<button class="qm-btn" data-act="new-expense"><span class="qb-ic" style="background:var(--red-soft);color:var(--red)">' + icon('doc') + '</span><b>记支出</b><small>运费、人工、包装</small></button>' +
            '<button class="qm-btn" data-act="new-payment"><span class="qb-ic" style="background:#f3eafc;color:#7b46b5">' + icon('download') + '</span><b>付货款</b><small>还供货商的钱</small></button>' +
            '<button class="qm-btn" data-act="add-party"><span class="qb-ic" style="background:#eef2f0;color:#47554f">' + icon('users') + '</span><b>加客户</b><small>新建往来单位</small></button>' +
            '</div>'
        });
        break;

      case 'new-sale': closeSheet(); setTimeout(function () { openEntry('sale'); }, 60); break;
      case 'new-purchase': closeSheet(); setTimeout(function () { openEntry('purchase'); }, 60); break;
      case 'new-receipt': closeSheet(); setTimeout(function () { openSettle('customer'); }, 60); break;
      case 'new-payment': closeSheet(); setTimeout(function () { openSettle('supplier'); }, 60); break;
      case 'new-expense': closeSheet(); setTimeout(function () { openExpense(); }, 60); break;
      case 'new-settle': openSettle(kind, id); break;

      case 'add-item':
        var box = $('#items');
        var div = document.createElement('div');
        div.innerHTML = itemRowHTML(blankItem());
        box.appendChild(div.firstChild);
        var rows = $$('#items .item-row');
        var last = rows[rows.length - 1];
        $('.ir-name', last).focus();
        break;

      case 'del-item':
        var row = el.closest('.item-row');
        if ($$('#items .item-row').length <= 1) { toast('至少留一行'); break; }
        row.parentNode.removeChild(row);
        recalcEntry();
        break;

      case 'pick-product':
        var pname = el.getAttribute('data-name');
        var prod = null;
        db.products.forEach(function (p) { if (p.name === pname) prod = p; });
        var target = null;
        $$('#items .item-row').forEach(function (x) {
          if (!$('.ir-name', x).value.trim()) target = x;
        });
        if (!target) {
          var d2 = document.createElement('div');
          d2.innerHTML = itemRowHTML(blankItem());
          $('#items').appendChild(d2.firstChild);
          target = $$('#items .item-row').pop();
        }
        $('.ir-name', target).value = pname;
        if (prod) {
          $('.ir-unit', target).value = prod.unit || '斤';
          if (!$('.ir-price', target).value && prod.price) $('.ir-price', target).value = S.fmtNum(prod.price);
        }
        $('.ir-qty', target).focus();
        recalcEntry();
        break;

      case 'pick-party':
        var forId = el.getAttribute('data-for');
        var partyInput = document.getElementById(forId);
        if (partyInput) {
          partyInput.value = el.getAttribute('data-name') || '';
          if (forId === 's-party') updateSettleBalance();
        }
        break;

      case 'pay-all':
        var tot = 0;
        $$('#items .item-row').forEach(function (r2) {
          tot += S.round2(S.num($('.ir-qty', r2).value) * S.num($('.ir-price', r2).value));
        });
        $('#f-paid').value = S.fmtNum(S.round2(tot));
        recalcEntry();
        break;

      case 'pay-none':
        $('#f-paid').value = '0';
        recalcEntry();
        break;

      case 'settle-all':
        var sp = $('#s-party').value.trim();
        var found = null;
        db.customers.concat(db.suppliers).forEach(function (x) { if (x.name === sp) found = x; });
        if (found) {
          var kk = db.customers.indexOf(found) >= 0 ? 'customer' : 'supplier';
          var b = S.partyBalance(db, kk, found.id);
          $('#s-amount').value = S.fmtNum(Math.abs(b));
        } else {
          toast('先选一个客户');
        }
        break;

      case 'save-entry':
        saveEntry(el.getAttribute('data-type'), id || null, el.getAttribute('data-bill') === '1');
        break;
      case 'open-bill': openBill(id); break;
      case 'share-bill': shareBill(id); break;
      case 'copy-bill': copyBill(id); break;
      case 'pick-qr': pickQR(); break;
      case 'del-qr':
        db.settings.qr = '';
        S.saveStorage(db);
        if ($('#qrBox')) $('#qrBox').innerHTML = qrBoxHTML();
        toast('已删除收款码');
        break;
      case 'save-settle':
        saveSettle(kind, id || null);
        break;
      case 'save-expense':
        saveExpense(id || null);
        break;
      case 'save-party':
        saveParty(kind, id || null);
        break;
      case 'save-settings':
        saveSettings();
        break;

      case 'bill-range': ui.billRange = el.getAttribute('data-v'); render(false); break;
      case 'bill-type': ui.billType = el.getAttribute('data-v'); render(false); break;
      case 'stat-range': ui.statRange = el.getAttribute('data-v'); render(false); break;
      case 'party-kind': ui.partyKind = el.getAttribute('data-v'); render(false); break;

      case 'open-record': openRecord(id); break;
      case 'edit-record':
        var er = db.records.filter(function (r) { return r.id === id; })[0];
        if (!er) break;
        closeSheet();
        setTimeout(function () {
          if (er.type === 'sale' || er.type === 'purchase') openEntry(er.type, er);
          else if (er.type === 'expense') openExpense(er);
          else openSettle(er.type === 'receipt' ? 'customer' : 'supplier', '', er);
        }, 60);
        break;
      case 'del-record': delRecord(id); break;

      case 'open-party': openParty(el.getAttribute('data-kind'), id); break;
      case 'add-party':
        closeSheet();
        setTimeout(function () { openPartyForm(ui.partyKind || 'customer'); }, 60);
        break;
      case 'edit-party': openPartyForm(kind, id); break;
      case 'del-party': delParty(kind, id); break;

      case 'open-stmt': openStatement(kind, id); break;
      case 'stmt-refresh': refreshStatement(); break;
      case 'stmt-print': printStatement(); break;

      case 'pick-cat':
        ui.expenseCat = el.getAttribute('data-v');
        $$('#e-cats .chip').forEach(function (c) { c.classList.toggle('active', c === el); });
        break;

      case 'open-settings': openSettings(); break;

      case 'export-csv':
        download('水果记账_' + stamp() + '.csv', S.toCSV(db), 'text/csv;charset=utf-8');
        toast('已导出，用 Excel 打开');
        break;
      case 'export-json':
        download('水果记账备份_' + stamp() + '.json', S.exportJSON(db), 'application/json');
        toast('备份已导出，请存到微信/网盘');
        break;
      case 'import-json': importFile(); break;
      case 'load-demo': loadDemo(); break;
      case 'clear-all':
        confirmSheet('清空后所有客户、供货商和账单都会消失，<br/>确定继续吗？', '清空').then(function (ok) {
          if (!ok) return;
          db = S.emptyDB();
          S.saveStorage(db);
          go('home');
          toast('已清空');
        });
        break;
    }
  });

  /* 输入时实时算钱 */
  document.addEventListener('input', function (e) {
    var t = e.target;
    if (!t || !t.classList) return;
    if (t.id === 's-party') { updateSettleBalance(); return; }
    if (t.classList.contains('ir-qty') || t.classList.contains('ir-price') || t.id === 'f-paid') {
      recalcEntry();
    }
  });

  /* 选中常用水果后自动带出单位、单价 */
  document.addEventListener('change', function (e) {
    var t = e.target;
    if (!t || !t.classList) return;
    if (t.id === 'stmtFrom' || t.id === 'stmtTo') {
      if (!$('#stmtFrom') || !$('#stmtTo')) return;
      $('#stmtWrap').innerHTML = statementHTML(ui.stmt.kind, ui.stmt.id, $('#stmtFrom').value, $('#stmtTo').value);
      return;
    }
    if (t.id === 's-party') { updateSettleBalance(); return; }
    if (!t.classList.contains('ir-name')) return;
    var name = t.value.trim();
    if (!name) return;
    var row = t.closest('.item-row');
    db.products.forEach(function (p) {
      if (p.name !== name) return;
      if (p.unit) $('.ir-unit', row).value = p.unit;
      if (p.price && !$('.ir-price', row).value) $('.ir-price', row).value = S.fmtNum(p.price);
    });
    recalcEntry();
  });

  /* 回车跳到下一个输入框 */
  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Enter') return;
    var t = e.target;
    if (!t || t.tagName !== 'INPUT') return;
    if (!$('#sheetRoot').classList.contains('open')) return;
    var inputs = $$('#sheetRoot input, #sheetRoot select').filter(function (x) { return x.offsetParent !== null; });
    var i = inputs.indexOf(t);
    if (i >= 0 && i < inputs.length - 1) {
      e.preventDefault();
      inputs[i + 1].focus();
    }
  });

  /* ================= 导入 / 示例 ================= */

  function importFile() {
    var input = document.createElement('input');
    input.type = 'file';
    input.accept = '.json,application/json';
    input.addEventListener('change', function () {
      var f = input.files && input.files[0];
      if (!f) return;
      var reader = new FileReader();
      reader.onload = function () {
        try {
          var next = S.importJSON(String(reader.result));
          confirmSheet('导入会覆盖当前所有数据（现有 ' + db.records.length + ' 笔），<br/>确定吗？', '覆盖导入').then(function (ok) {
            if (!ok) return;
            db = next;
            S.saveStorage(db);
            go('home');
            toast('导入成功，共 ' + db.records.length + ' 笔');
          });
        } catch (err) {
          toast('导入失败：' + err.message);
        }
      };
      reader.readAsText(f, 'utf-8');
    });
    input.click();
  }

  function loadDemo() {
    confirmSheet('会载入一套演示数据（客户、供货商、账单），<br/>覆盖当前数据，确定吗？', '载入演示').then(function (ok) {
      if (!ok) return;
      db = S.demoDB();
      S.saveStorage(db);
      go('home');
      toast('演示数据已载入');
    });
  }

  /* ================= 启动 ================= */

  // 支持 ?tab=bills 直接打开某个页面
  (function initTab() {
    try {
      var m = /[?&]tab=([a-z]+)/.exec(location.search);
      if (m && TABS.some(function (t) { return t.id === m[1]; })) ui.tab = m[1];
    } catch (e) { /* ignore */ }
  })();

  render(true);

  /* 放到网上（https）时注册离线缓存：装了之后没信号也能打开 */
  if ('serviceWorker' in navigator && location.protocol === 'https:') {
    window.addEventListener('load', function () {
      try {
        navigator.serviceWorker.register('sw.js').catch(function () {});
      } catch (e) { /* 忽略 */ }
    });
  }

  /* 调试用入口（不影响正常使用） */
  window.SGApp = {
    get db() { return db; },
    ui: ui,
    render: render,
    openEntry: openEntry,
    openSettle: openSettle,
    openExpense: openExpense,
    openParty: openParty,
    openStatement: openStatement,
    openRecord: openRecord,
    openSettings: openSettings,
    openBill: openBill,
    billText: billText
  };
})();

</script>
</body>
</html>
