<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#1f7a3d" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="水果记账" />
  <meta name="format-detection" content="telephone=no" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='15' fill='%231f7a3d'/%3E%3Ctext x='32' y='45' font-size='36' text-anchor='middle' fill='%23fff' font-family='sans-serif'%3E%E8%AE%B0%3C/text%3E%3C/svg%3E" />
  <title>水果记账本</title>
  <style>
/* 水果记账本 —— 移动端优先样式 */
:root {
  --bg: #f2f5f3;
  --card: #ffffff;
  --ink: #16211c;
  --ink2: #47554f;
  --muted: #8b968f;
  --line: #e8ece9;
  --green: #1f7a3d;
  --green-2: #2f9c55;
  --green-soft: #e8f5ec;
  --orange: #d97b1c;
  --orange-soft: #fdf0e1;
  --red: #c8403a;
  --red-soft: #fceceb;
  --blue: #2c6aa8;
  --blue-soft: #e9f1fa;
  --radius: 16px;
  --shadow: 0 2px 10px rgba(18, 48, 32, .055);
  --tab-h: 58px;
  --fg-font: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", sans-serif;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--fg-font);
  font-size: 15px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
}

body.no-scroll { overflow: hidden; }

button, input, select, textarea {
  font-family: inherit;
  font-size: inherit;
  color: inherit;
}
button { cursor: pointer; border: none; background: none; padding: 0; }
input, select { outline: none; }

.ico { width: 20px; height: 20px; display: block; }

/* ---------------- 外框 ---------------- */
.app {
  max-width: 760px;
  margin: 0 auto;
  min-height: 100vh;
  padding-bottom: calc(var(--tab-h) + 86px);
  position: relative;
}

.topbar {
  position: sticky;
  top: 0;
  z-index: 20;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: calc(10px + env(safe-area-inset-top)) 16px 10px;
  background: linear-gradient(180deg, #1f7a3d 0%, #248044 100%);
  color: #fff;
  border-radius: 0 0 18px 18px;
  box-shadow: 0 3px 14px rgba(15, 70, 38, .18);
}
.topbar-main { flex: 1; min-width: 0; }
.shop-name {
  font-size: 17px;
  font-weight: 700;
  letter-spacing: .2px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.shop-sub { font-size: 12px; opacity: .82; margin-top: 1px; }
.topbar .icon-btn { color: #fff; background: rgba(255, 255, 255, .16); }

.icon-btn {
  width: 36px; height: 36px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  color: var(--ink2);
  background: #f0f3f1;
  flex: none;
}
.icon-btn:active { transform: scale(.94); }

.view { padding: 12px 14px 0; }

/* ---------------- 通用块 ---------------- */
.card {
  background: var(--card);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 14px;
  margin-bottom: 12px;
}

.section-head {
  display: flex; align-items: center; justify-content: space-between;
  margin: 16px 4px 8px;
}
.section-head h3 { margin: 0; font-size: 14px; color: var(--ink2); font-weight: 600; }
.link { color: var(--green); font-size: 13px; }

.pos { color: var(--green); }
.neg { color: var(--red); }
.warn { color: var(--orange); }
.muted { color: var(--muted); }
.num { font-variant-numeric: tabular-nums; }

/* ---------------- 首页 ---------------- */
.hero {
  background: linear-gradient(135deg, #237d41 0%, #2f9c55 62%, #47ad63 100%);
  color: #fff;
  padding: 16px 16px 14px;
  position: relative;
  overflow: hidden;
}
.hero::after {
  content: "";
  position: absolute;
  right: -40px; top: -50px;
  width: 150px; height: 150px;
  border-radius: 50%;
  background: rgba(255, 255, 255, .09);
}
.hero-top { display: flex; align-items: baseline; justify-content: space-between; font-size: 12px; opacity: .9; }
.hero-num { font-size: 34px; font-weight: 800; letter-spacing: -.5px; margin: 4px 0 10px; font-variant-numeric: tabular-nums; }
.hero-foot { display: flex; gap: 8px; }
.hero-foot > div {
  flex: 1;
  background: rgba(255, 255, 255, .14);
  border-radius: 11px;
  padding: 7px 9px;
}
.hero-foot b { display: block; font-size: 15px; font-variant-numeric: tabular-nums; }
.hero-foot span { font-size: 11px; opacity: .85; }

.quad { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
.quad-item {
  background: #fff; border-radius: 14px; padding: 11px 13px;
  box-shadow: var(--shadow);
  display: flex; flex-direction: column; gap: 2px;
}
.quad-item span { font-size: 12px; color: var(--muted); }
.quad-item b { font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; }

.debt {
  display: flex; align-items: center; gap: 6px;
  padding: 14px;
}
.debt-item { flex: 1; }
.debt-item span { display: block; font-size: 12px; color: var(--muted); }
.debt-item b { font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; }
.chev { color: #c6cec9; }

.quick { display: grid; grid-template-columns: repeat(4, 1fr); gap: 9px; margin: 12px 0 4px; }
.quick-btn {
  background: #fff;
  border-radius: 14px;
  padding: 12px 4px 10px;
  box-shadow: var(--shadow);
  display: flex; flex-direction: column; align-items: center; gap: 6px;
  font-size: 13px; color: var(--ink2); font-weight: 500;
}
.quick-btn .qb-ic {
  width: 34px; height: 34px; border-radius: 11px;
  display: flex; align-items: center; justify-content: center;
}
.quick-btn:active { transform: scale(.96); }
.q-sale .qb-ic { background: var(--green-soft); color: var(--green); }
.q-buy .qb-ic { background: var(--orange-soft); color: var(--orange); }
.q-in .qb-ic { background: var(--blue-soft); color: var(--blue); }
.q-out .qb-ic { background: var(--red-soft); color: var(--red); }

/* ---------------- 列表行 ---------------- */
.list { background: #fff; border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; }
.row {
  display: flex; align-items: center; gap: 11px;
  padding: 12px 14px;
  border-bottom: 1px solid var(--line);
  background: #fff;
}
.row:last-child { border-bottom: none; }
.row:active { background: #f7f9f8; }
.badge {
  width: 30px; height: 30px; border-radius: 9px;
  display: flex; align-items: center; justify-content: center;
  font-size: 13px; font-weight: 700; flex: none;
}
.b-sale { background: var(--green-soft); color: var(--green); }
.b-purchase { background: var(--orange-soft); color: var(--orange); }
.b-receipt { background: var(--blue-soft); color: var(--blue); }
.b-payment { background: #f3eafc; color: #7b46b5; }
.b-expense { background: var(--red-soft); color: var(--red); }
.row-main { flex: 1; min-width: 0; }
.row-title {
  font-size: 15px; font-weight: 600;
  display: flex; align-items: center; gap: 6px;
  min-width: 0;
}
.row-title .t {
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0;
}
.row-sub {
  font-size: 12px; color: var(--muted); margin-top: 2px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.row-amt { font-size: 16px; font-weight: 700; font-variant-numeric: tabular-nums; text-align: right; flex: none; }
.row-amt small { display: block; font-size: 11px; font-weight: 500; color: var(--muted); }
.tag-debt {
  font-style: normal; font-size: 11px; font-weight: 600;
  color: var(--red); background: var(--red-soft);
  padding: 1px 6px; border-radius: 6px; flex: none;
}

.empty {
  text-align: center; color: var(--muted);
  padding: 34px 20px; font-size: 13px; line-height: 1.9;
}
.empty b { display: block; font-size: 15px; color: var(--ink2); margin-bottom: 4px; }
.empty .btn-primary { margin-top: 14px; display: inline-flex; width: auto; padding: 9px 22px; }

/* ---------------- 账单页 ---------------- */
.filters { margin-bottom: 10px; }
.chips { display: flex; gap: 7px; overflow-x: auto; padding: 2px 0 8px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip {
  flex: none;
  padding: 6px 13px;
  border-radius: 999px;
  background: #fff;
  border: 1px solid var(--line);
  font-size: 13px;
  color: var(--ink2);
  white-space: nowrap;
}
.chip.active { background: var(--green); color: #fff; border-color: var(--green); font-weight: 600; }

.sumline {
  display: flex; gap: 12px; flex-wrap: wrap;
  font-size: 12px; color: var(--muted);
  padding: 0 4px 8px;
}
.sumline b { font-variant-numeric: tabular-nums; font-weight: 600; }

.day-head {
  display: flex; justify-content: space-between; align-items: baseline;
  font-size: 12px; color: var(--muted);
  padding: 12px 4px 6px;
}
.day-head span:first-child { font-weight: 600; color: var(--ink2); font-size: 13px; }

/* ---------------- 往来单位 ---------------- */
.segmented {
  display: flex; background: #e7ebe8; border-radius: 11px; padding: 3px; margin-bottom: 12px;
}
.segmented button {
  flex: 1; padding: 8px; border-radius: 9px;
  font-size: 14px; color: var(--ink2); font-weight: 500;
}
.segmented button.active { background: #fff; color: var(--green); font-weight: 700; box-shadow: 0 1px 4px rgba(0, 0, 0, .07); }

.party-row { display: flex; align-items: center; gap: 12px; padding: 13px 14px; border-bottom: 1px solid var(--line); }
.party-row:last-child { border-bottom: none; }
.avatar {
  width: 38px; height: 38px; border-radius: 12px; flex: none;
  background: var(--green-soft); color: var(--green);
  display: flex; align-items: center; justify-content: center;
  font-size: 15px; font-weight: 700;
}
.party-main { flex: 1; min-width: 0; }
.party-name { font-size: 15px; font-weight: 600; display: flex; align-items: center; gap: 6px; }
.party-sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
.party-amt { text-align: right; font-variant-numeric: tabular-nums; }
.party-amt b { font-size: 17px; font-weight: 700; display: block; }
.party-amt span { font-size: 11px; color: var(--muted); }

/* ---------------- 统计 ---------------- */
.stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
.stat-cell { background: #fff; border-radius: 14px; padding: 12px 13px; box-shadow: var(--shadow); }
.stat-cell span { font-size: 12px; color: var(--muted); }
.stat-cell b { display: block; font-size: 19px; font-weight: 700; margin-top: 2px; font-variant-numeric: tabular-nums; }
.stat-cell i { font-style: normal; font-size: 11px; color: var(--muted); }

.chart { display: flex; align-items: flex-end; gap: 2px; height: 128px; overflow-x: auto; padding-top: 6px; }
.chart-col { flex: 1; min-width: 6px; display: flex; flex-direction: column; align-items: center; height: 100%; }
.chart-bars { flex: 1; width: 100%; display: flex; align-items: flex-end; justify-content: center; gap: 2px; }
.chart-bars i { width: 46%; max-width: 8px; border-radius: 3px 3px 0 0; display: block; min-height: 2px; }
.bar-sale { background: var(--green-2); }
.bar-buy { background: #f0b46a; }
.chart-x { font-size: 9px; color: var(--muted); margin-top: 4px; height: 12px; }
.legend { display: flex; gap: 14px; font-size: 11px; color: var(--muted); margin-top: 8px; }
.legend i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 4px; }

.rank-item { display: flex; align-items: center; gap: 10px; padding: 9px 0; }
.rank-no {
  width: 20px; height: 20px; border-radius: 6px; flex: none;
  background: #f0f3f1; color: var(--muted);
  font-size: 11px; font-weight: 700;
  display: flex; align-items: center; justify-content: center;
}
.rank-item.top1 .rank-no { background: var(--green); color: #fff; }
.rank-item.top2 .rank-no { background: #ffd9a8; color: #97590e; }
.rank-item.top3 .rank-no { background: #e2e7e4; color: #5a6660; }
.rank-main { flex: 1; min-width: 0; }
.rank-name { font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rank-bar { height: 5px; background: #eef1ef; border-radius: 3px; margin-top: 5px; overflow: hidden; }
.rank-bar i { display: block; height: 100%; background: linear-gradient(90deg, #4caf6f, #2f9c55); border-radius: 3px; }
.rank-val { font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; text-align: right; flex: none; }
.rank-val small { display: block; font-size: 11px; color: var(--muted); font-weight: 500; }

/* ---------------- 我的 ---------------- */
.list-group { background: #fff; border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; margin-bottom: 12px; }
.group-row { display: flex; align-items: center; gap: 12px; padding: 14px; border-bottom: 1px solid var(--line); font-size: 15px; }
.group-row:last-child { border-bottom: none; }
.group-row:active { background: #f7f9f8; }
.group-row .gr-ic { width: 28px; height: 28px; border-radius: 8px; display: flex; align-items: center; justify-content: center; flex: none; }
.group-row .gr-main { flex: 1; }
.group-row .gr-sub { font-size: 12px; color: var(--muted); }
.group-row .chev { color: #c6cec9; }
.danger { color: var(--red) !important; }
.tips { font-size: 12px; color: var(--muted); padding: 0 6px 20px; line-height: 1.8; }

/* ---------------- 底部 tab ---------------- */
.tabbar {
  position: fixed;
  left: 50%; bottom: 0;
  transform: translateX(-50%);
  width: 100%;
  max-width: 760px;
  height: calc(var(--tab-h) + env(safe-area-inset-bottom));
  padding-bottom: env(safe-area-inset-bottom);
  background: rgba(255, 255, 255, .96);
  -webkit-backdrop-filter: blur(10px);
  backdrop-filter: blur(10px);
  border-top: 1px solid var(--line);
  display: flex;
  z-index: 30;
}
.tabbar button {
  flex: 1;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
  color: #9aa5a0; font-size: 11px;
}
.tabbar button.active { color: var(--green); font-weight: 600; }
.tabbar .ico { width: 22px; height: 22px; }

.fab {
  position: fixed;
  right: max(16px, calc(50% - 380px + 16px));
  bottom: calc(var(--tab-h) + 18px + env(safe-area-inset-bottom));
  width: 56px; height: 56px;
  border-radius: 50%;
  background: linear-gradient(135deg, #2f9c55, #1f7a3d);
  color: #fff;
  font-size: 30px; font-weight: 300; line-height: 1;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 6px 18px rgba(31, 122, 61, .38);
  z-index: 31;
}
.fab:active { transform: scale(.93); }

/* ---------------- 弹层 ---------------- */
.sheet-root { position: fixed; inset: 0; z-index: 100; display: none; }
.sheet-root.open { display: block; }
.sheet-mask { position: absolute; inset: 0; background: rgba(12, 26, 18, .42); animation: fadeIn .18s ease; }
.sheet {
  position: absolute;
  left: 50%; bottom: 0;
  transform: translateX(-50%);
  width: 100%; max-width: 760px;
  max-height: 92vh;
  background: #f6f8f7;
  border-radius: 20px 20px 0 0;
  display: flex; flex-direction: column;
  animation: slideUp .24s cubic-bezier(.22, .8, .3, 1);
  overflow: hidden;
}
@keyframes slideUp { from { transform: translate(-50%, 100%); } to { transform: translate(-50%, 0); } }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.sheet-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 16px 10px;
  background: #f6f8f7;
  flex: none;
}
.sheet-head h2 { margin: 0; font-size: 17px; font-weight: 700; }
.sheet-body { flex: 1; overflow-y: auto; padding: 4px 14px 20px; -webkit-overflow-scrolling: touch; }
.sheet-foot {
  flex: none;
  padding: 10px 14px calc(12px + env(safe-area-inset-bottom));
  background: #fff;
  border-top: 1px solid var(--line);
  display: flex; gap: 10px;
}

.btn-primary {
  flex: 1;
  height: 48px;
  border-radius: 13px;
  background: linear-gradient(135deg, #2f9c55, #1f7a3d);
  color: #fff;
  font-size: 16px;
  font-weight: 600;
  display: flex; align-items: center; justify-content: center; gap: 6px;
  box-shadow: 0 4px 12px rgba(31, 122, 61, .24);
}
.btn-primary:active { transform: scale(.985); }
.btn-ghost {
  height: 48px; padding: 0 20px;
  border-radius: 13px;
  background: #eef2f0;
  color: var(--ink2);
  font-size: 15px;
  display: flex; align-items: center; justify-content: center;
}
.btn-ghost.sq { width: 48px; padding: 0; }

/* ---------------- 表单 ---------------- */
.form { display: flex; flex-direction: column; gap: 10px; }
.row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.field { display: flex; flex-direction: column; gap: 5px; }
.field > span { font-size: 12px; color: var(--muted); padding-left: 2px; }
.field input, .field select {
  height: 46px;
  border-radius: 12px;
  border: 1px solid var(--line);
  background: #fff;
  padding: 0 12px;
  font-size: 16px;
  width: 100%;
  appearance: none;
}
.field input:focus, .field select:focus { border-color: var(--green-2); box-shadow: 0 0 0 3px rgba(47, 156, 85, .12); }
.field input::placeholder { color: #b3bcb7; font-size: 14px; }

.field-block {
  background: #fff; border-radius: 14px; border: 1px solid var(--line);
  padding: 10px 10px 8px; display: flex; flex-direction: column; gap: 8px;
}
.block-head { display: flex; align-items: center; justify-content: space-between; }
.block-head > span { font-size: 12px; color: var(--muted); padding-left: 2px; }
.mini-btn { font-size: 13px; color: var(--green); font-weight: 600; padding: 2px 4px; }

.item-row { background: #f7f9f8; border-radius: 11px; padding: 8px; display: flex; flex-direction: column; gap: 7px; }
.ir-line { display: flex; align-items: center; gap: 6px; }
.ir-name {
  flex: 1; height: 38px; border-radius: 9px; border: 1px solid var(--line);
  background: #fff; padding: 0 10px; font-size: 15px; min-width: 0;
}
.ir-del { width: 30px; height: 30px; border-radius: 50%; color: #b3bcb7; display: flex; align-items: center; justify-content: center; flex: none; }
.ir-del .ico { width: 16px; height: 16px; }
.ir-grid { display: grid; grid-template-columns: 1.1fr .9fr 1.1fr 1fr; gap: 6px; }
.ir-cell { display: flex; flex-direction: column; gap: 2px; }
.ir-cell span { font-size: 10px; color: var(--muted); padding-left: 3px; }
.ir-cell input, .ir-cell select {
  height: 38px; border-radius: 9px; border: 1px solid var(--line);
  background: #fff; padding: 0 8px; font-size: 15px; width: 100%; appearance: none;
}
.ir-amt { display: flex; flex-direction: column; gap: 2px; }
.ir-amt span { font-size: 10px; color: var(--muted); padding-left: 3px; }
.ir-amt b { height: 38px; display: flex; align-items: center; justify-content: flex-end; font-size: 15px; font-variant-numeric: tabular-nums; padding-right: 2px; }

.common-strip { display: flex; gap: 6px; overflow-x: auto; padding: 2px 0; scrollbar-width: none; }
.common-strip::-webkit-scrollbar { display: none; }
.strip-block { display: flex; flex-direction: column; gap: 4px; }
.strip-label { font-size: 11px; color: var(--muted); padding-left: 3px; }
.pchip {
  flex: none; padding: 6px 11px; border-radius: 999px;
  background: #fff; border: 1px solid var(--line);
  font-size: 12px; color: var(--ink2);
}
.pchip b { font-weight: 600; }

.sum-card { background: #fff; border-radius: 14px; border: 1px solid var(--line); padding: 12px 14px; display: flex; flex-direction: column; gap: 9px; }
.sum-line { display: flex; align-items: center; justify-content: space-between; font-size: 14px; color: var(--ink2); }
.sum-line > b { font-size: 22px; font-weight: 800; font-variant-numeric: tabular-nums; }
.sum-line input {
  width: 130px; height: 40px; text-align: right; font-size: 17px; font-weight: 600;
  border: 1px solid var(--line); border-radius: 10px; padding: 0 10px; background: #f7f9f8;
}
.pay-actions { display: flex; gap: 8px; justify-content: flex-end; }
.pay-actions button { font-size: 12px; padding: 5px 12px; border-radius: 999px; background: #eef2f0; color: var(--ink2); }
.pay-actions button.primary { background: var(--green-soft); color: var(--green); font-weight: 600; }
.debt-line { border-top: 1px dashed var(--line); padding-top: 9px; }
.debt-line b { font-size: 16px; color: var(--red); }

.quick-menu { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 6px 2px 10px; }
.qm-btn {
  background: #fff; border-radius: 16px; padding: 16px;
  display: flex; flex-direction: column; gap: 7px;
  box-shadow: var(--shadow); text-align: left;
}
.qm-btn .qb-ic { width: 40px; height: 40px; border-radius: 12px; display: flex; align-items: center; justify-content: center; }
.qm-btn b { font-size: 16px; }
.qm-btn small { font-size: 12px; color: var(--muted); }

/* 详情 */
.detail-hero { text-align: center; padding: 6px 0 16px; }
.detail-hero .dh-label { font-size: 12px; color: var(--muted); }
.detail-hero .dh-num { font-size: 36px; font-weight: 800; font-variant-numeric: tabular-nums; margin-top: 2px; }
.detail-hero .dh-sub { font-size: 12px; color: var(--muted); margin-top: 6px; }
.detail-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; margin-bottom: 12px; }
.detail-actions button {
  background: #fff; border-radius: 12px; padding: 12px;
  font-size: 14px; color: var(--ink2); font-weight: 500;
  box-shadow: var(--shadow);
}
.detail-actions button.primary { background: var(--green); color: #fff; font-weight: 600; box-shadow: 0 4px 12px rgba(31, 122, 61, .22); }

/* 开单预览 */
.bill-preview {
  display: block;
  width: 100%;
  max-width: 420px;
  min-height: 180px;
  margin: 2px auto 0;
  border-radius: 14px;
  background: #f4f6f5;
  box-shadow: 0 8px 26px rgba(18, 48, 32, .16);
}
.bill-hint {
  font-size: 12px;
  color: var(--muted);
  text-align: center;
  margin: 12px 0 4px;
  line-height: 1.8;
}
.bill-hint b { color: var(--green); }

.kv { display: flex; justify-content: space-between; padding: 11px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
.kv:last-child { border-bottom: none; }
.kv span { color: var(--muted); }
.kv b { font-weight: 600; font-variant-numeric: tabular-nums; }

/* 对账单 */
.stmt-table { width: 100%; border-collapse: collapse; background: #fff; font-size: 12px; border-radius: 12px; overflow: hidden; }
.stmt-table th, .stmt-table td { padding: 7px 6px; border-bottom: 1px solid var(--line); text-align: right; }
.stmt-table th { background: #f4f7f5; color: var(--muted); font-weight: 600; font-size: 11px; }
.stmt-table th:first-child, .stmt-table td:first-child { text-align: left; }
.stmt-table td.num { font-variant-numeric: tabular-nums; }
.stmt-table tr:last-child td { border-bottom: none; }
.stmt-total { display: flex; justify-content: space-between; padding: 10px 2px; font-size: 13px; }

.range-row { display: flex; gap: 8px; align-items: flex-end; margin-bottom: 10px; }

.range-row .field input { height: 42px; font-size: 14px; }

/* ---------------- toast ---------------- */
.toast-root {
  position: fixed; left: 0; right: 0;
  bottom: calc(var(--tab-h) + 90px);
  display: flex; flex-direction: column; align-items: center; gap: 8px;
  pointer-events: none; z-index: 200;
}
.toast {
  background: rgba(22, 33, 28, .92);
  color: #fff;
  padding: 9px 18px;
  border-radius: 999px;
  font-size: 13px;
  animation: toastIn .2s ease;
  max-width: 80vw;
  text-align: center;
}
@keyframes toastIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

/* ---------------- 打印 ---------------- */
.print-root { display: none; }

@media print {
  body { background: #fff; }
  .app, #sheetRoot, .toast-root { display: none !important; }
  .print-root { display: block !important; }
  .print-sheet { max-width: 190mm; margin: 0 auto; padding: 6mm 0; color: #000; font-family: var(--fg-font); }
  .print-sheet h1 { font-size: 20px; text-align: center; margin: 0 0 4px; letter-spacing: 4px; }
  .print-sheet .p-sub { text-align: center; font-size: 12px; color: #444; margin-bottom: 12px; }
  .print-sheet .p-meta { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 8px; }
  .print-sheet table { width: 100%; border-collapse: collapse; font-size: 11.5px; }

  .print-sheet td.r { text-align: right; font-variant-numeric: tabular-nums; }
  .print-sheet .p-foot { display: flex; justify-content: space-between; margin-top: 26px; font-size: 12px; }
  .print-sheet .p-thanks { text-align: center; font-size: 11px; color: #666; margin-top: 18px; }
}

/* ---------------- 桌面适配 ---------------- */
@media (min-width: 640px) {
  .view { padding: 16px 18px 0; }
  .hero-num { font-size: 38px; }
  .quad { grid-template-columns: repeat(4, 1fr); }
  .stat-grid { grid-template-columns: repeat(4, 1fr); }
  .quick { gap: 12px; }
  .sheet { border-radius: 20px; bottom: auto; top: 50%; transform: translate(-50%, -50%); max-height: 88vh; animation: popIn .2s ease; }
  @keyframes popIn { from { opacity: 0; transform: translate(-50%, -46%); } to { opacity: 1; transform: translate(-50%, -50%); } }
}

<body>
  <div class="app">
    <header class="topbar">
      <div class="topbar-main">
        <div class="shop-name" id="shopName">我的水果批发</div>
        <div class="shop-sub" id="shopSub"></div>
      </div>
      <button class="icon-btn" data-act="open-settings" aria-label="设置" id="btnSettings"></button>
    </header>

    <main id="view" class="view" role="main"></main>

    <nav class="tabbar" id="tabbar" role="tablist"></nav>
    <button class="fab" data-act="quick-add" aria-label="记一笔">＋</button>
  </div>

  <div id="sheetRoot" class="sheet-root"></div>
  <div id="toastRoot" class="toast-root"></div>
  <div id="printRoot" class="print-root"></div>

  <datalist id="prodList"></datalist>
  <datalist id="partyList"></datalist>

  <script>
/*!
 * 水果批发记账本 —— 数据层
 * 纯 JS，不依赖 DOM，可在 Node 中直接测试。
 * 账单模型统一为 records，type 取值：sale 销售 / purchase 采购 / receipt 收款 / payment 付款 / expense 支出
 */
(function (root, factory) {
  'use strict';
  var api = factory();
  if (typeof module === 'object' && module.exports) module.exports = api;
  if (root) root.SGStore = api;
})(typeof globalThis !== 'undefined' ? globalThis : this, function () {
  'use strict';

  var DB_KEY = 'sgjz.v1';
  var BACKUP_KEY = 'sgjz.backup.v1';

  var UNITS = ['斤', '公斤', '箱', '件', '筐', '袋', '个'];
  var EXPENSE_CATS = ['运费', '人工', '包装', '租金', '水电', '损耗', '其他'];

  var TYPE_META = {
    sale: { label: '卖货', long: '销售单', kind: 'customer', short: '销' },
    purchase: { label: '进货', long: '采购单', kind: 'supplier', short: '采' },
    receipt: { label: '收欠款', long: '收款', kind: 'customer', short: '收' },
    payment: { label: '付货款', long: '付款', kind: 'supplier', short: '付' },
    expense: { label: '支出', long: '费用', kind: '', short: '支' }
  };

  /* ---------------- 基础工具 ---------------- */

  function uid() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  }

  function num(v) {
    if (typeof v === 'number') return isFinite(v) ? v : 0;
    var s = String(v == null ? '' : v).replace(/[^\d.\-]/g, '');
    var n = parseFloat(s);
    return isFinite(n) ? n : 0;
  }

  function round2(n) {
    var x = Number(n);
    if (!isFinite(x)) x = 0;
    // 先收敛浮点误差（1.005*100 = 100.49999…），避免 0.01 级误差
    return Math.round(Number((x * 100).toFixed(4))) / 100;
  }

  function fmtNum(n) {
    var v = round2(num(n));
    var neg = v < 0;
    v = Math.abs(v);
    var s = Number.isInteger(v) ? String(v) : v.toFixed(2);
    var parts = s.split('.');
    parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',');
    return (neg ? '-' : '') + parts.join('.');
  }

  function money(n) {
    var v = round2(num(n));
    return (v < 0 ? '-' : '') + '¥' + fmtNum(Math.abs(v));
  }

  function pad2(n) { return n < 10 ? '0' + n : String(n); }

  function dateStr(d) {
    return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
  }

  function today() { return dateStr(new Date()); }

  function parseDate(s) {
    var p = String(s || '').split('-');
    return new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]));
  }

  function addDays(s, n) {
    var d = parseDate(s);
    d.setDate(d.getDate() + n);
    return dateStr(d);
  }

  function monthRange(offset) {
    var d = new Date();
    d.setDate(1);
    d.setMonth(d.getMonth() + (offset || 0));
    var from = dateStr(d);
    var end = new Date(d.getFullYear(), d.getMonth() + 1, 0);
    return [from, dateStr(end)];
  }

  function weekStart(s) {
    var d = parseDate(s);
    var wd = d.getDay() === 0 ? 7 : d.getDay();
    d.setDate(d.getDate() - (wd - 1));
    return dateStr(d);
  }

  var WEEK_CN = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];

  function weekdayCN(s) { return WEEK_CN[parseDate(s).getDay()]; }

  function cnDate(s) {
    var d = parseDate(s);
    return (d.getMonth() + 1) + '月' + d.getDate() + '日';
  }

  function inRange(date, from, to) {
    if (from && date < from) return false;
    if (to && date > to) return false;
    return true;
  }

  /* ---------------- 数据结构 ---------------- */

  function emptyDB() {
    return {
      version: 1,
      settings: { shopName: '我的水果批发', owner: '', phone: '', address: '', qr: '' },
      customers: [],
      suppliers: [],
      products: [],
      records: []
    };
  }

  function normalize(raw) {
    var base = emptyDB();
    if (!raw || typeof raw !== 'object') return base;
    var out = {
      version: 1,
      settings: Object.assign({}, base.settings, raw.settings || {}),
      customers: [],
      suppliers: [],
      products: [],
      records: []
    };
    ['customers', 'suppliers'].forEach(function (k) {
      (Array.isArray(raw[k]) ? raw[k] : []).forEach(function (p) {
        if (!p || !p.name) return;
        out[k].push({
          id: p.id || uid(),
          name: String(p.name),
          phone: p.phone || '',
          note: p.note || '',
          opening: round2(num(p.opening)),
          createdAt: p.createdAt || Date.now()
        });
      });
    });
    (Array.isArray(raw.products) ? raw.products : []).forEach(function (p) {
      if (!p || !p.name) return;
      out.products.push({
        id: p.id || uid(),
        name: String(p.name),
        unit: p.unit || '斤',
        price: round2(num(p.price)),
        lastUsedAt: p.lastUsedAt || 0
      });
    });
    (Array.isArray(raw.records) ? raw.records : []).forEach(function (r) {
      if (!r || !r.type || !TYPE_META[r.type]) return;
      var rec = {
        id: r.id || uid(),
        type: r.type,
        date: r.date || today(),
        note: r.note || '',
        createdAt: r.createdAt || Date.now(),
        partyId: r.partyId || '',
        partyName: r.partyName || ''
      };
      if (r.type === 'sale' || r.type === 'purchase') {
        rec.items = (Array.isArray(r.items) ? r.items : []).map(function (it) {
          return {
            name: String(it.name || '').trim() || '未命名',
            unit: it.unit || '斤',
            qty: round2(num(it.qty)),
            price: round2(num(it.price)),
            amount: round2(num(it.amount) || num(it.qty) * num(it.price))
          };
        });
        rec.total = r.total != null
          ? round2(num(r.total))
          : round2(rec.items.reduce(function (s, it) { return s + it.amount; }, 0));
        rec.paid = r.paid != null ? round2(num(r.paid)) : rec.total;
      } else if (r.type === 'receipt' || r.type === 'payment') {
        rec.amount = round2(num(r.amount));
      } else if (r.type === 'expense') {
        rec.amount = round2(num(r.amount));
        rec.category = r.category || '其他';
      }
      out.records.push(rec);
    });
    out.records.sort(sortRecords);
    return out;
  }

  function sortRecords(a, b) {
    if (a.date !== b.date) return a.date < b.date ? 1 : -1;
    return (b.createdAt || 0) - (a.createdAt || 0);
  }

  /* ---------------- 读写 ---------------- */

  function loadStorage() {
    try {
      if (typeof localStorage === 'undefined') return emptyDB();
      var raw = localStorage.getItem(DB_KEY);
      if (!raw) return emptyDB();
      return normalize(JSON.parse(raw));
    } catch (e) {
      console.warn('[记账本] 读取数据失败：', e);
      return emptyDB();
    }
  }

  function saveStorage(db) {
    try {
      if (typeof localStorage === 'undefined') return false;
      var json = JSON.stringify(db);
      var prev = localStorage.getItem(DB_KEY);
      if (prev && prev !== json) localStorage.setItem(BACKUP_KEY, prev);
      localStorage.setItem(DB_KEY, json);
      return true;
    } catch (e) {
      console.warn('[记账本] 保存失败：', e);
      return false;
    }
  }

  /* ---------------- 往来单位余额 ---------------- */

  function findParty(db, kind, id) {
    var list = kind === 'customer' ? db.customers : db.suppliers;
    for (var i = 0; i < list.length; i++) if (list[i].id === id) return list[i];
    return null;
  }

  /**
   * 应收（客户）/ 应付（供货商）余额
   * 客户：期初 + Σ(销售金额 - 开单时已收) - Σ收款
   * 供货商：期初 + Σ(采购金额 - 开单时已付) - Σ付款
   */
  function partyBalance(db, kind, partyId) {
    var p = findParty(db, kind, partyId);
    if (!p) return 0;
    var bal = num(p.opening);
    var isCustomer = kind === 'customer';
    for (var i = 0; i < db.records.length; i++) {
      var r = db.records[i];
      if (r.partyId !== partyId) continue;
      if (isCustomer) {
        if (r.type === 'sale') bal += num(r.total) - num(r.paid);
        else if (r.type === 'receipt') bal -= num(r.amount);
      } else {
        if (r.type === 'purchase') bal += num(r.total) - num(r.paid);
        else if (r.type === 'payment') bal -= num(r.amount);
      }
    }
    return round2(bal);
  }

  /** 欠款（>0 才计），用于首页合计 */
  function receivableTotal(db) {
    var t = 0;
    db.customers.forEach(function (c) {
      var b = partyBalance(db, 'customer', c.id);
      if (b > 0) t += b;
    });
    return round2(t);
  }

  function prepaidTotal(db) {
    var t = 0;
    db.customers.forEach(function (c) {
      var b = partyBalance(db, 'customer', c.id);
      if (b < 0) t += -b;
    });
    return round2(t);
  }

  function payableTotal(db) {
    var t = 0;
    db.suppliers.forEach(function (c) {
      var b = partyBalance(db, 'supplier', c.id);
      if (b > 0) t += b;
    });
    return round2(t);
  }

  function partyLastDate(db, kind, partyId) {
    var isCustomer = kind === 'customer';
    for (var i = 0; i < db.records.length; i++) {
      var r = db.records[i];
      if (r.partyId !== partyId) continue;
      if (isCustomer && (r.type === 'sale' || r.type === 'receipt')) return r.date;
      if (!isCustomer && (r.type === 'purchase' || r.type === 'payment')) return r.date;
    }
    return '';
  }

  function partyList(db, kind) {
    var list = (kind === 'customer' ? db.customers : db.suppliers).map(function (p) {
      var bal = partyBalance(db, kind, p.id);
      return {
        id: p.id,
        name: p.name,
        phone: p.phone,
        note: p.note,
        balance: bal,
        lastDate: partyLastDate(db, kind, p.id)
      };
    });
    list.sort(function (a, b) {
      if (Math.abs(b.balance) !== Math.abs(a.balance)) return Math.abs(b.balance) - Math.abs(a.balance);
      return (b.lastDate || '') < (a.lastDate || '') ? -1 : 1;
    });
    return list;
  }

  function partyRecords(db, kind, partyId) {
    var isCustomer = kind === 'customer';
    return db.records.filter(function (r) {
      if (r.partyId !== partyId) return false;
      return isCustomer ? (r.type === 'sale' || r.type === 'receipt') : (r.type === 'purchase' || r.type === 'payment');
    });
  }

  /* ---------------- 区间统计 ---------------- */

  /**
   * 现金口径 + 经营口径
   * sale 销售收入 / purchase 采购支出 / expense 其他费用
   * cashIn 实际进账（销售单已收 + 收款） / cashOut 实际出账（采购单已付 + 付款 + 费用）
   */
  function rangeStats(db, from, to) {
    var s = {
      sale: 0, purchase: 0, expense: 0,
      cashIn: 0, cashOut: 0,
      saleCount: 0, purchaseCount: 0, expenseCount: 0, receiptCount: 0, paymentCount: 0,
      creditSale: 0, creditPurchase: 0
    };
    db.records.forEach(function (r) {
      if (!inRange(r.date, from, to)) return;
      if (r.type === 'sale') {
        s.sale += num(r.total); s.cashIn += num(r.paid); s.saleCount++;
        s.creditSale += num(r.total) - num(r.paid);
      } else if (r.type === 'purchase') {
        s.purchase += num(r.total); s.cashOut += num(r.paid); s.purchaseCount++;
        s.creditPurchase += num(r.total) - num(r.paid);
      } else if (r.type === 'expense') {
        s.expense += num(r.amount); s.cashOut += num(r.amount); s.expenseCount++;
      } else if (r.type === 'receipt') {
        s.cashIn += num(r.amount); s.receiptCount++;
      } else if (r.type === 'payment') {
        s.cashOut += num(r.amount); s.paymentCount++;
      }
    });
    s.sale = round2(s.sale);
    s.purchase = round2(s.purchase);
    s.expense = round2(s.expense);
    s.cashIn = round2(s.cashIn);
    s.cashOut = round2(s.cashOut);
    s.gross = round2(s.sale - s.purchase);            // 进销差额
    s.net = round2(s.sale - s.purchase - s.expense);  // 扣掉费用后的经营结余
    s.cashBalance = round2(s.cashIn - s.cashOut);     // 现金流水
    s.creditSale = round2(s.creditSale);
    s.creditPurchase = round2(s.creditPurchase);
    return s;
  }

  function expenseByCat(db, from, to) {
    var map = {};
    db.records.forEach(function (r) {
      if (r.type !== 'expense' || !inRange(r.date, from, to)) return;
      var k = r.category || '其他';
      map[k] = round2((map[k] || 0) + num(r.amount));
    });
    return Object.keys(map).map(function (k) { return { name: k, amount: map[k] }; })
      .sort(function (a, b) { return b.amount - a.amount; });
  }

  function topProducts(db, from, to, limit) {
    var map = {};
    db.records.forEach(function (r) {
      if (r.type !== 'sale' || !inRange(r.date, from, to)) return;
      (r.items || []).forEach(function (it) {
        var k = it.name;
        if (!map[k]) map[k] = { name: k, unit: it.unit || '斤', qty: 0, amount: 0 };
        map[k].qty = round2(map[k].qty + num(it.qty));
        map[k].amount = round2(map[k].amount + num(it.amount));
      });
    });
    return Object.keys(map).map(function (k) { return map[k]; })
      .sort(function (a, b) { return b.amount - a.amount; })
      .slice(0, limit || 5);
  }

  function topParties(db, from, to, kind, limit) {
    var isCustomer = kind === 'customer';
    var map = {};
    db.records.forEach(function (r) {
      if (!inRange(r.date, from, to)) return;
      var hit = isCustomer ? r.type === 'sale' : r.type === 'purchase';
      if (!hit || !r.partyId) return;
      if (!map[r.partyId]) map[r.partyId] = { name: r.partyName, amount: 0, count: 0 };
      map[r.partyId].amount = round2(map[r.partyId].amount + num(r.total));
      map[r.partyId].count++;
    });
    return Object.keys(map).map(function (k) { return map[k]; })
      .sort(function (a, b) { return b.amount - a.amount; })
      .slice(0, limit || 5);
  }

  function dailySeries(db, from, to) {
    var map = {};
    db.records.forEach(function (r) {
      if (!inRange(r.date, from, to)) return;
      if (!map[r.date]) map[r.date] = { date: r.date, sale: 0, purchase: 0 };
      if (r.type === 'sale') map[r.date].sale = round2(map[r.date].sale + num(r.total));
      if (r.type === 'purchase') map[r.date].purchase = round2(map[r.date].purchase + num(r.total));
    });
    var out = [];
    var d = from;
    var guard = 0;
    while (d <= to && guard < 400) {
      out.push(map[d] || { date: d, sale: 0, purchase: 0 });
      d = addDays(d, 1);
      guard++;
    }
    return out;
  }

  function unbilledList(db, kind) {
    return partyList(db, kind).filter(function (p) { return round2(p.balance) > 0; });
  }

  /* ---------------- 对账单 ---------------- */

  function statement(db, kind, partyId, from, to) {
    var p = findParty(db, kind, partyId);
    if (!p) return null;
    var isCustomer = kind === 'customer';
    var all = partyRecords(db, kind, partyId).slice().sort(function (a, b) {
      if (a.date !== b.date) return a.date < b.date ? -1 : 1;
      return (a.createdAt || 0) - (b.createdAt || 0);
    });
    function deltaOf(r) {
      var amount = 0;   // 单据金额
      var paid = 0;     // 开单时当场已收 / 已付
      var delta = 0;    // 对欠款的影响
      var label = '';
      if (isCustomer) {
        if (r.type === 'sale') { amount = num(r.total); paid = num(r.paid); delta = round2(amount - paid); label = '销售'; }
        else if (r.type === 'receipt') { paid = num(r.amount); delta = round2(-paid); label = '收款'; }
      } else {
        if (r.type === 'purchase') { amount = num(r.total); paid = num(r.paid); delta = round2(amount - paid); label = '采购'; }
        else if (r.type === 'payment') { paid = num(r.amount); delta = round2(-paid); label = '付款'; }
      }
      return { amount: round2(amount), paid: round2(paid), delta: delta, label: label };
    }

    // 第一遍：把区间开始之前的发生额并进期初余额
    var opening = num(p.opening);
    all.forEach(function (r) {
      if (r.date >= (from || '')) return;
      opening += deltaOf(r).delta;
    });
    opening = round2(opening);

    // 第二遍：区间内的流水，结余从期初开始滚动
    var rows = [];
    var balance = opening;
    all.forEach(function (r) {
      if (r.date < (from || '')) return;
      if (to && r.date > to) return;
      var d = deltaOf(r);
      balance = round2(balance + d.delta);
      rows.push({
        id: r.id, date: r.date, type: r.type, label: d.label,
        detail: itemsText(r.items), note: r.note || '',
        amount: d.amount, paid: d.paid, delta: d.delta, balance: balance
      });
    });
    var totalIn = 0, totalOut = 0;
    rows.forEach(function (x) {
      if (x.delta > 0) totalIn += x.delta;
      else totalOut += -x.delta;
    });
    return {
      party: p,
      kind: kind,
      from: from,
      to: to,
      opening: opening,
      rows: rows,
      closing: round2(balance),
      totalIn: round2(totalIn),   // 本期新增欠款
      totalOut: round2(totalOut)  // 本期回收 / 支付
    };
  }

  function itemsText(items) {
    if (!items || !items.length) return '';
    return items.map(function (it) {
      return it.name + ' ' + round2(it.qty) + it.unit + '×' + round2(it.price);
    }).join('，');
  }

  /* ---------------- 导入导出 ---------------- */

  function toCSV(db) {
    var head = ['日期', '类型', '往来单位', '明细', '数量', '单价', '金额', '已收/已付', '欠款', '备注'];
    var lines = [head.join(',')];
    db.records.forEach(function (r) {
      var type = (TYPE_META[r.type] || {}).long || r.type;
      if (r.type === 'sale' || r.type === 'purchase') {
        r.items.forEach(function (it) {
          var debt = round2(num(r.total) - num(r.paid));
          lines.push([
            r.date, type, r.partyName || '', it.name, round2(it.qty), round2(it.price),
            round2(it.amount), '', debt, (r.note || '').replace(/,/g, '，')
          ].join(','));
        });
        if (!r.items.length) {
          lines.push([r.date, type, r.partyName || '', '', '', '', r.total, r.paid, round2(r.total - r.paid), (r.note || '').replace(/,/g, '，')].join(','));
        }
      } else {
        lines.push([
          r.date, type, r.partyName || '', r.category || '', '', '', r.amount, r.amount, '', (r.note || '').replace(/,/g, '，')
        ].join(','));
      }
    });
    return '\ufeff' + lines.join('\r\n');
  }

  function exportJSON(db) { return JSON.stringify(db, null, 2); }

  function importJSON(text) {
    var raw = JSON.parse(text);
    if (!raw || typeof raw !== 'object') throw new Error('文件内容不是有效数据');
    var has = (raw.records && raw.records.length) || (raw.customers && raw.customers.length);
    if (!has) throw new Error('没有找到账单数据，请确认是本 App 导出的文件');
    return normalize(raw);
  }

    a.href = url;

      if (debt > 0.004) debtTag = '<em class="tag-debt">欠 ' + money(debt) + '</em>';
      amt = money(r.total);
      cls = r.type === 'sale' ? 'pos' : 'warn';
    } else if (r.type === 'expense') {
      title = r.category || '支出';
      sub = r.note || '';
      amt = money(r.amount);
      cls = 'neg';
    } else {
      title = r.partyName || '—';
      sub = r.note || (r.type === 'receipt' ? '客户还欠款' : '付给供货商');
      amt = money(r.amount);
      cls = r.type === 'receipt' ? 'pos' : 'neg';
    }
    if (sub === title) sub = '';

    return '<div class="row" data-act="open-record" data-id="' + r.id + '">' +
      '<span class="badge b-' + r.type + '">' + (meta.short || '') + '</span>' +
      '<div class="row-main">' +
        '<div class="row-title"><span class="t">' + esc(title) + '</span>' + debtTag + '</div>' +
        (sub ? '<div class="row-sub">' + esc(sub) + '</div>' : '') +
      '</div>' +
      '<div class="row-amt ' + cls + '">' + amt + '</div>' +
      '</div>';
  }

  /* ================= 账单页 ================= */

  function resolveRange(preset) {
    var t = S.today();
    if (preset === 'today') return [t, t];
    if (preset === 'week') return [S.weekStart(t), t];
    if (preset === 'month') return S.monthRange(0);
    if (preset === 'lastMonth') return S.monthRange(-1);
    if (preset === 'year') return [t.slice(0, 4) + '-01-01', t.slice(0, 4) + '-12-31'];
    return ['', ''];
  }

  function viewBills() {
    var rg = resolveRange(ui.billRange);
    var from = rg[0], to = rg[1];
    var list = db.records.filter(function (r) {
      if (from && r.date < from) return false;
      if (to && r.date > to) return false;
      if (ui.billType !== 'all' && r.type !== ui.billType) return false;
      return true;
    });

    var income = 0, outcome = 0;
    list.forEach(function (r) {
      if (r.type === 'sale') income += S.num(r.total);
      else if (r.type === 'receipt') income += S.num(r.amount);
      else if (r.type === 'purchase' || r.type === 'expense' || r.type === 'payment') outcome += S.num(r.type === 'expense' ? r.amount : (r.total || r.amount));
    });

    var ranges = [['today', '今天'], ['week', '本周'], ['month', '本月'], ['lastMonth', '上月'], ['all', '全部']];
    var types = [['all', '全部'], ['sale', '卖货'], ['purchase', '进货'], ['receipt', '收款'], ['payment', '付款'], ['expense', '支出']];

    var h = '<div class="filters">';
    h += '<div class="chips">' + ranges.map(function (x) {
      return '<button class="chip ' + (ui.billRange === x[0] ? 'active' : '') + '" data-act="bill-range" data-v="' + x[0] + '">' + x[1] + '</button>';
    }).join('') + '</div>';
    h += '<div class="chips">' + types.map(function (x) {
      return '<button class="chip ' + (ui.billType === x[0] ? 'active' : '') + '" data-act="bill-type" data-v="' + x[0] + '">' + x[1] + '</button>';
    }).join('') + '</div>';
    h += '</div>';

    h += '<div class="sumline"><span>共 <b>' + list.length + '</b> 笔</span>' +
      '<span>收入合计 <b class="pos">' + money(income) + '</b></span>' +
      '<span>支出合计 <b class="neg">' + money(outcome) + '</b></span></div>';

    if (!list.length) {
      h += '<div class="card"><div class="empty"><b>这个范围没有账单</b>换个时间或类型试试</div></div>';
      return h;
    }

    var groups = [];
    var lastDate = null;
    list.forEach(function (r) {
      if (r.date !== lastDate) {
        groups.push({ date: r.date, rows: [] });
        lastDate = r.date;
      }
      groups[groups.length - 1].rows.push(r);
    });

    groups.forEach(function (g) {
      var dayIn = 0, dayOut = 0;
      g.rows.forEach(function (r) {
        if (r.type === 'sale') dayIn += S.num(r.total);
        else if (r.type === 'purchase' || r.type === 'expense') dayOut += S.num(r.total || r.amount);
        else if (r.type === 'receipt') dayIn += S.num(r.amount);
        else if (r.type === 'payment') dayOut += S.num(r.amount);
      });
      h += '<div class="day-head"><span>' + S.cnDate(g.date) + ' ' + S.weekdayCN(g.date) + '</span>' +
        '<span>收 ' + money(dayIn) + ' · 支 ' + money(dayOut) + '</span></div>';
      h += '<div class="list">' + g.rows.map(recordRow).join('') + '</div>';
    });

    return h;
  }

  /* ================= 往来单位 ================= */

  function viewParties() {
    var kind = ui.partyKind;
    var isC = kind === 'customer';
    var list = S.partyList(db, kind);
    var total = isC ? S.receivableTotal(db) : S.payableTotal(db);
    var count = list.filter(function (p) { return S.round2(p.balance) > 0; }).length;

    var h = '<div class="segmented">' +
      '<button class="' + (isC ? 'active' : '') + '" data-act="party-kind" data-v="customer">客户欠我</button>' +
      '<button class="' + (!isC ? 'active' : '') + '" data-act="party-kind" data-v="supplier">我欠供货商</button>' +
      '</div>';

    h += '<div class="card" style="display:flex;align-items:center">' +
      '<div style="flex:1">' +
        '<div style="font-size:12px;color:var(--muted)">' + (isC ? '应收合计' : '应付合计') + ' · ' + count + ' 家未结清</div>' +
        '<div style="font-size:28px;font-weight:800;font-variant-numeric:tabular-nums" class="' + (isC ? 'neg' : 'warn') + '">' + money(total) + '</div>' +
      '</div>' +
      '<button class="btn-ghost" data-act="add-party">＋ 新增</button>' +
      '</div>';

    if (!list.length) {
      h += '<div class="card"><div class="empty"><b>还没有' + (isC ? '客户' : '供货商') + '</b>记第一笔账时会自动创建，<br/>也可以点右上角「新增」。</div></div>';
      return h;
    }

    h += '<div class="list">' + list.map(function (p) {
      var bal = S.round2(p.balance);
      var balCls = bal > 0 ? (isC ? 'neg' : 'warn') : 'muted';
      var balTxt = bal === 0 ? '已结清' : money(Math.abs(bal));
      var subTxt = p.phone || p.note || '';
      if (bal < 0) subTxt = (isC ? '预存 ' : '预付 ') + money(-bal);
      return '<div class="party-row" data-act="open-party" data-kind="' + kind + '" data-id="' + p.id + '">' +
        '<span class="avatar">' + esc(p.name.slice(0, 1)) + '</span>' +
        '<div class="party-main">' +
          '<div class="party-name">' + esc(p.name) + '</div>' +
          '<div class="party-sub">' + esc(subTxt || (p.lastDate ? '最近 ' + S.cnDate(p.lastDate) : '还没有往来')) + '</div>' +
        '</div>' +
        '<div class="party-amt"><b class="' + balCls + '">' + balTxt + '</b><span>' + (bal === 0 ? '' : (isC ? '欠款' : '应付')) + '</span></div>' +
        '</div>';
    }).join('') + '</div>';

    return h;
  }

  /* ================= 统计 ================= */

  function viewStats() {
    var rg = resolveRange(ui.statRange);
    var st = S.rangeStats(db, rg[0], rg[1]);
    var cats = S.expenseByCat(db, rg[0], rg[1]);
    var prods = S.topProducts(db, rg[0], rg[1], 5);
    var custs = S.topParties(db, rg[0], rg[1], 'customer', 5);
    var sFrom = rg[0] || S.addDays(S.today(), -29);
    var sTo = rg[1] || S.today();
    if (sTo > S.today()) sTo = S.today();
    var series = S.dailySeries(db, sFrom, sTo);

    var presets = [['month', '本月'], ['lastMonth', '上月'], ['week', '本周'], ['year', '今年'], ['all', '全部']];
    var h = '<div class="chips">' + presets.map(function (x) {
      return '<button class="chip ' + (ui.statRange === x[0] ? 'active' : '') + '" data-act="stat-range" data-v="' + x[0] + '">' + x[1] + '</button>';
    }).join('') + '</div>';

    h += '<div class="stat-grid">' +
      '<div class="stat-cell"><span>卖货收入</span><b class="pos">' + money(st.sale) + '</b><i>' + st.saleCount + ' 单</i></div>' +
      '<div class="stat-cell"><span>进货成本</span><b class="warn">' + money(st.purchase) + '</b><i>' + st.purchaseCount + ' 单</i></div>' +
      '<div class="stat-cell"><span>其他费用</span><b class="neg">' + money(st.expense) + '</b><i>' + st.expenseCount + ' 笔</i></div>' +
      '<div class="stat-cell"><span>本期结余</span><b class="' + (st.net >= 0 ? 'pos' : 'neg') + '">' + money(st.net) + '</b><i>卖货-进货-费用</i></div>' +
      '</div>';

    h += '<div class="card">' +
      '<div style="display:flex;justify-content:space-between;font-size:13px;color:var(--ink2)">' +
      '<span>实际进账 <b class="pos">' + money(st.cashIn) + '</b></span>' +
      '<span>实际出账 <b class="neg">' + money(st.cashOut) + '</b></span>' +
      '<span>现金净流入 <b class="' + (st.cashBalance >= 0 ? 'pos' : 'neg') + '">' + money(st.cashBalance) + '</b></span>' +
      '</div>' +
      '<div style="display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:8px;border-top:1px dashed var(--line);padding-top:8px">' +
      '<span>赊出去 ' + money(st.creditSale) + '</span>' +
      '<span>欠供货商 ' + money(st.creditPurchase) + '</span>' +
      '<span>毛利（未扣费用） ' + money(st.gross) + '</span>' +
      '</div></div>';

    if (series.length) {
      var max = 1;
      series.forEach(function (d) { max = Math.max(max, d.sale, d.purchase); });
      h += '<div class="card"><div class="section-head" style="margin:0 0 6px"><h3>每天卖货 / 进货</h3></div>';
      h += '<div class="chart">' + series.map(function (d, i) {
        var sh = d.sale > 0 ? Math.max(3, Math.round(d.sale / max * 100)) : 0;
        var ph = d.purchase > 0 ? Math.max(3, Math.round(d.purchase / max * 100)) : 0;
        var showX = series.length <= 12 || i % 5 === 0 || i === series.length - 1;
        return '<div class="chart-col"><div class="chart-bars">' +
          '<i class="bar-sale" style="height:' + sh + '%"></i>' +
          '<i class="bar-buy" style="height:' + ph + '%"></i>' +
          '</div><div class="chart-x">' + (showX ? d.date.slice(8) : '') + '</div></div>';
      }).join('') + '</div>';
      h += '<div class="legend"><span><i class="bar-sale"></i>卖货</span><span><i class="bar-buy"></i>进货</span></div></div>';
    }

    if (prods.length) {
      h += '<div class="card"><div class="section-head" style="margin:0 0 2px"><h3>卖得最多的水果</h3></div>';
      var pmax = prods[0].amount || 1;
      h += prods.map(function (p, i) {
        return '<div class="rank-item' + (i < 3 ? ' top' + (i + 1) : '') + '"><span class="rank-no">' + (i + 1) + '</span>' +
          '<div class="rank-main"><div class="rank-name">' + esc(p.name) + '</div>' +
          '<div class="rank-bar"><i style="width:' + Math.round(p.amount / pmax * 100) + '%"></i></div></div>' +
          '<div class="rank-val">' + money(p.amount) + '<small>' + S.fmtNum(p.qty) + p.unit + '</small></div></div>';
      }).join('') + '</div>';
    }

    if (cats.length) {
      h += '<div class="card"><div class="section-head" style="margin:0 0 2px"><h3>钱花在哪了</h3></div>';
      cats.forEach(function (c) {
        h += '<div class="kv"><span>' + esc(c.name) + '</span><b class="neg">' + money(c.amount) + '</b></div>';
      });
      h += '</div>';
    }

    if (custs.length) {
      h += '<div class="card"><div class="section-head" style="margin:0 0 2px"><h3>进货最多的客户</h3></div>';
      var cmax = custs[0].amount || 1;
      h += custs.map(function (p, i) {
        return '<div class="rank-item' + (i < 3 ? ' top' + (i + 1) : '') + '"><span class="rank-no">' + (i + 1) + '</span>' +
          '<div class="rank-main"><div class="rank-name">' + esc(p.name) + '</div>' +
          '<div class="rank-bar"><i style="width:' + Math.round(p.amount / cmax * 100) + '%"></i></div></div>' +
          '<div class="rank-val">' + money(p.amount) + '<small>' + p.count + ' 单</small></div></div>';
      }).join('') + '</div>';
    }

    if (!db.records.length) {
      h += '<div class="card"><div class="empty"><b>还没有数据</b>记几笔账，这里就有图表了</div></div>';
    }

    return h;
  }

  /* ================= 我的 ================= */

    var h = '';
    h += '<div class="card" style="display:flex;align-items:center;gap:12px">' +

        '<div style="font-size:12px;color:var(--muted)">共 ' + db.records.length + ' 笔账 · ' + db.customers.length + ' 个客户 · ' + db.suppliers.length + ' 个供货商</div>' +

      '<div class="kv"><span>累计费用</span><b class="neg">' + money(st.expense) + '</b></div>' +

  function row2(ic, title, sub, act, cls) {
    var danger = cls === 'danger';
    return '<div class="group-row" data-act="' + act + '">' +
      '<span class="gr-ic" style="background:' + (danger ? 'var(--red-soft);color:var(--red)' : 'var(--green-soft);color:var(--green)') + '">' + icon(ic) + '</span>' +
      '<div class="gr-main"><div class="' + (danger ? 'danger' : '') + '">' + title + '</div>' +
      '<div class="gr-sub">' + sub + '</div></div>' +
      '<span class="chev">' + icon('arrow') + '</span></div>';
  }

  /* ================= 弹层基础 ================= */

  function openSheet(opts) {
    var root = $('#sheetRoot');
    root.innerHTML =
      '<div class="sheet-mask" data-act="close-sheet"></div>' +
      '<div class="sheet" role="dialog" aria-modal="true">' +
        '<div class="sheet-head"><h2>' + esc(opts.title) + '</h2>' +
          '<button class="icon-btn" data-act="close-sheet">' + icon('close') + '</button></div>' +
        '<div class="sheet-body">' + opts.body + '</div>' +
        (opts.foot ? '<div class="sheet-foot">' + opts.foot + '</div>' : '') +
      '</div>';
    root.classList.add('open');
    document.body.classList.add('no-scroll');
    if (opts.after) opts.after();
  }

  function closeSheet() {
    var root = $('#sheetRoot');
    root.classList.remove('open');
    root.innerHTML = '';
    document.body.classList.remove('no-scroll');
    var cb = ui.onSheetClose;
    ui.onSheetClose = null;
    if (cb) cb();
  }

  function confirmSheet(msg, okText) {
    return new Promise(function (resolve) {
      var settled = false;
      function finish(v) {
        if (settled) return;
        settled = true;
        ui.onSheetClose = null;
        closeSheet();
        resolve(v);
      }
      openSheet({
        title: '请确认',
        body: '<div style="padding:18px 8px 26px;text-align:center;font-size:15px;line-height:1.7">' + msg + '</div>',
        foot: '<button class="btn-ghost" data-act="close-sheet" style="flex:1">取消</button>' +
          '<button class="btn-primary" id="confirmOk" style="flex:1">' + (okText || '确定') + '</button>'
      });
      ui.onSheetClose = function () { finish(false); };
      $('#confirmOk').addEventListener('click', function () { finish(true); });
    });
  }

  /* ================= 记账表单 ================= */

  function blankItem() { return { name: '', unit: '斤', qty: '', price: '' }; }

  function unitOptions(cur) {
    var list = S.UNITS.slice();
    if (cur && list.indexOf(cur) < 0) list.unshift(cur);
    return list.map(function (u) {
      return '<option value="' + u + '"' + (u === (cur || '斤') ? ' selected' : '') + '>' + u + '</option>';
    }).join('');
  }

  function itemRowHTML(it) {
    return '<div class="item-row">' +
      '<div class="ir-line">' +
        '<input class="ir-name" list="prodList" placeholder="水果名，如 砂糖橘" value="' + esc(it.name) + '">' +
        '<button class="ir-del" data-act="del-item" aria-label="删除这一行">' + icon('close') + '</button>' +
      '</div>' +
      '<div class="ir-grid">' +
        '<label class="ir-cell"><span>数量</span><input class="ir-qty" inputmode="decimal" placeholder="0" value="' + esc(it.qty) + '"></label>' +
        '<label class="ir-cell"><span>单位</span><select class="ir-unit">' + unitOptions(it.unit) + '</select></label>' +
        '<label class="ir-cell"><span>单价</span><input class="ir-price" inputmode="decimal" placeholder="0" value="' + esc(it.price) + '"></label>' +
        '<div class="ir-amt"><span>金额</span><b>¥0</b></div>' +
      '</div>' +
      '</div>';
  }

  function productChipsHTML() {
    var list = db.products.slice().sort(function (a, b) { return (b.lastUsedAt || 0) - (a.lastUsedAt || 0); }).slice(0, 10);
    if (!list.length) return '';
    return '<div class="common-strip">' + list.map(function (p) {
      return '<button class="pchip" data-act="pick-product" data-name="' + esc(p.name) + '">' + esc(p.name) +
        '<b>' + (p.price ? ' ¥' + S.fmtNum(p.price) : '') + '</b></button>';
    }).join('') + '</div>';
  }

  /* iPhone 的 Safari 不支持 datalist 下拉候选，用这排按钮代替 */
  function partyChipsHTML(kind, targetId) {
    var list = S.partyList(db, kind).slice();
    list.sort(function (a, b) {
      if (a.lastDate === b.lastDate) return Math.abs(b.balance) - Math.abs(a.balance);
      return (a.lastDate || '') < (b.lastDate || '') ? 1 : -1;
    });
    list = list.slice(0, 8);
    if (!list.length) return '';
    return '<div class="common-strip">' + list.map(function (p) {
      return '<button class="pchip" data-act="pick-party" data-for="' + targetId + '" data-name="' + esc(p.name) + '">' +
        esc(p.name) + (Math.abs(p.balance) > 0 ? '<b>' + S.fmtNum(Math.abs(p.balance)) + '</b>' : '') + '</button>';
    }).join('') + '</div>';
  }

  function stripHTML(label, chips) {
    if (!chips) return '';
    return '<div class="strip-block"><span class="strip-label">' + label + '</span>' + chips + '</div>';
  }

  function openEntry(type, rec) {

    body += '<div class="row-2">' +
      '<label class="field"><span>日期</span><input id="f-date" type="date" value="' + (rec ? rec.date : S.today()) + '"></label>' +
      '<label class="field"><span>' + (isSale ? '客户' : '供货商') + '</span>' +
        '<input id="f-party" list="partyList" placeholder="输入或选择" value="' + esc(rec ? rec.partyName : '') + '"></label>' +
      '</div>';

    if (!parties.length) {
      body += '<div style="font-size:12px;color:var(--muted);padding:0 2px">还没有' + (isSale ? '客户' : '供货商') + '，直接输入名字就行，会自动建好。</div>';
    }

    body += stripHTML(isSale ? '常来的客户' : '常来的供货商', partyChipsHTML(kind, 'f-party'));

    body += '<div class="field-block">' +
      '<div class="block-head"><span>商品明细</span><button class="mini-btn" data-act="add-item">＋ 加一行</button></div>' +
      '<div id="items">' + items.map(itemRowHTML).join('') + '</div>' +
      '</div>';

    body += stripHTML('常卖的水果', productChipsHTML());

    body += '<div class="sum-card">' +
      '<div class="sum-line"><span>合计</span><b id="f-total">¥0</b></div>' +
      '<div class="sum-line"><span>本次' + (isSale ? '收款' : '付款') + '</span>' +
        '<input id="f-paid" inputmode="decimal" placeholder="' + (isSale ? '不填=全款' : '不填=全付') + '"></div>' +

        '<button data-act="pay-all" class="primary">全款收清</button>' +
        '<button data-act="pay-none">先欠着</button>' +
      '</div>' +
      '<div class="sum-line debt-line"><span>' + (isSale ? '客户欠' : '我欠他') + '</span><b id="f-debt">¥0</b></div>' +
      '</div>';

    body += '<label class="field"><span>备注</span><input id="f-note" placeholder="选填，如：早上送货、微信转" value="' + esc(rec ? rec.note : '') + '"></label>';
    body += '</div>';

    var foot = (rec ? '<button class="btn-ghost sq danger" data-act="del-record" data-id="' + rec.id + '">' + icon('trash') + '</button>' : '') +
      '<button class="btn-ghost" data-act="save-entry" data-type="' + type + '" data-id="' + (rec ? rec.id : '') + '" style="flex:1">保存</button>' +
      '<button class="btn-primary" data-act="save-entry" data-bill="1" data-type="' + type + '" data-id="' + (rec ? rec.id : '') + '" style="flex:1.25">保存并开单</button>';

    var title = (rec ? '编辑' : '记一笔') + (isSale ? '卖货' : '进货');
    openSheet({
      title: title,
      body: body,
      foot: foot,
      after: function () {
        if (rec && rec.paid !== rec.total) {
          $('#f-paid').value = S.fmtNum(rec.paid);
        }
        recalcEntry();
        if (!rec) $('#f-party').focus();
      }
    });
    ui.entryType = type;
  }

  function recalcEntry() {
    var sheet = $('#sheetRoot');
    var total = 0;
    $$('#items .item-row', sheet).forEach(function (row) {
      var q = S.num($('.ir-qty', row).value);
      var p = S.num($('.ir-price', row).value);
      var a = S.round2(q * p);
      $('.ir-amt b', row).textContent = money(a);
      total += a;
    });
    total = S.round2(total);
    var totalEl = $('#f-total', sheet);
    if (!totalEl) return;
    totalEl.textContent = money(total);

    var paidInput = $('#f-paid', sheet);
    var raw = paidInput.value.trim();
    var paid = raw === '' ? total : S.num(raw);
    var debt = S.round2(total - paid);
    $('#f-debt', sheet).textContent = money(debt);
    $('#f-debt', sheet).className = debt > 0 ? 'neg' : 'pos';
  }

  function readEntryForm() {
    var sheet = $('#sheetRoot');
    var date = $('#f-date', sheet).value || S.today();
    var partyName = $('#f-party', sheet).value.trim();
    var items = [];
    $$('#items .item-row', sheet).forEach(function (row) {
      var name = $('.ir-name', row).value.trim();
      var unit = $('.ir-unit', row).value;
      var qty = S.num($('.ir-qty', row).value);
      var price = S.num($('.ir-price', row).value);
      if (!name && !qty && !price) return;
      items.push({ name: name || '未命名', unit: unit, qty: qty, price: price, amount: S.round2(qty * price) });
    });
    var total = S.round2(items.reduce(function (s, it) { return s + it.amount; }, 0));
    var raw = $('#f-paid', sheet).value.trim();
    var paid = raw === '' ? total : S.round2(S.num(raw));
    return {
      date: date,
      partyName: partyName,
      items: items,
      total: total,
      paid: paid,
      note: $('#f-note', sheet).value.trim()
    };
  }

  function resolveParty(kind, name) {
    name = (name || '').trim();
    if (!name) return { id: '', name: '' };
    var list = kind === 'customer' ? db.customers : db.suppliers;
    for (var i = 0; i < list.length; i++) if (list[i].name === name) return list[i];
    var p = { id: S.uid(), name: name, phone: '', note: '', opening: 0, createdAt: Date.now() };
    list.push(p);
    return p;
  }

  function upsertProduct(it) {
    if (!it.name || it.name === '未命名') return;
    for (var i = 0; i < db.products.length; i++) {
      if (db.products[i].name === it.name) {
        db.products[i].unit = it.unit;
        if (it.price) db.products[i].price = it.price;
        db.products[i].lastUsedAt = Date.now();
        return;
      }
    }
    db.products.push({ id: S.uid(), name: it.name, unit: it.unit, price: it.price || 0, lastUsedAt: Date.now() });
  }

  function saveEntry(type, editId, wantBill) {
    var payload = readEntryForm();
    if (!payload.items.length) { toast('请先填写水果名和数量'); return null; }
    if (payload.total <= 0) { toast('金额是 0，检查一下数量和单价'); return null; }

    var isSale = type === 'sale';
    var party = resolveParty(isSale ? 'customer' : 'supplier', payload.partyName);
    var rec = {
      id: editId || S.uid(),
      type: type,
      date: payload.date,
      partyId: party.id,
      partyName: party.name,
      items: payload.items,
      total: payload.total,
      paid: payload.paid,
      note: payload.note,
      createdAt: Date.now()
    };
    if (editId) {
      for (var i = 0; i < db.records.length; i++) {
        if (db.records[i].id === editId) {
          rec.createdAt = db.records[i].createdAt;
          db.records[i] = rec;
          break;
        }
      }
    } else {
      db.records.push(rec);
    }
    payload.items.forEach(upsertProduct);
    commit();
    closeSheet();
    toast((editId ? '已修改 ' : '已记上 ') + money(payload.total) + (payload.total - payload.paid > 0.004 ? '，欠 ' + money(payload.total - payload.paid) : ''));
    if (wantBill) {
      var rid = rec.id;
      setTimeout(function () { openBill(rid); }, 180);
    }
    return rec.id;
  }

    } else {
      db.records.push(rec);

    closeSheet();

  function updateSettleBalance() {
    var el = $('#s-party');

          list[i].note = note;
          break;

        if (r.partyId === id) r.partyName = name;

      list.push({ id: S.uid(), name: name, phone: phone, note: note, opening: opening, createdAt: Date.now() });

  /* ================= 开单：生成账单图片，分享到微信 ================= */

  function setFont(ctx, size, weight) {
    ctx.font = (weight || 'normal') + ' ' + size + 'px "PingFang SC","Helvetica Neue","Microsoft YaHei",sans-serif';
  }

  function billText(rec) {
    var isSale = rec.type === 'sale';
    var lines = [];
    lines.push('【' + (isSale ? '销售单' : '进货单') + '】' + (db.settings.shopName || ''));
    lines.push((isSale ? '客户' : '供货商') + '：' + (rec.partyName || '散客'));
    lines.push('日期：' + rec.date);
    lines.push('');
    (rec.items || []).forEach(function (it) {
      lines.push(it.name + '  ' + S.fmtNum(it.qty) + it.unit + ' × ' + S.fmtNum(it.price) + ' = ' + S.fmtNum(it.amount));
    });
    lines.push('');
    lines.push('合计：' + S.fmtNum(rec.total) + ' 元');
    lines.push((isSale ? '已收：' : '已付：') + S.fmtNum(rec.paid) + ' 元');
    var debt = S.round2(rec.total - rec.paid);
    if (debt > 0.004) lines.push((isSale ? '还欠：' : '还欠对方：') + S.fmtNum(debt) + ' 元');
    if (db.settings.phone) lines.push('联系电话：' + db.settings.phone);
    lines.push('—— 账单由「' + (db.settings.shopName || '水果记账本') + '」开出');
    return lines.join('\n');
  }

  /** 把一笔单子画成一张竖版账单图（微信里看得清） */
  /** 收银单号：20 位数字，看起来像正规小票 */
  function billNo(rec) {
    var d = String(rec.date).replace(/-/g, '');
    var id = String(rec.id);
    var seed = 0;
    for (var i = 0; i < id.length; i++) seed = (seed * 31 + id.charCodeAt(i)) % 10000000000;
    return '88' + d + ('0000000000' + seed).slice(-10);
  }

  /** 把一笔单子画成批发小票（客户联），样式对齐森果云收银小票 */
  function buildBillCanvas(rec, qrImg) {
    var isSale = rec.type === 'sale';
    var W = 720, PAD = 44, R = W - PAD, SCALE = 2;
    var all = rec.items || [];
    var items = all.slice(0, 14);
    var moreCount = all.length - items.length;

    var tmp = document.createElement('canvas');
    tmp.width = W * SCALE;
    tmp.height = 3200 * SCALE;
    var ctx = tmp.getContext('2d');
    ctx.scale(SCALE, SCALE);
    ctx.textBaseline = 'alphabetic';
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, W, 3200);

    var BLACK = '#111111', GRAY = '#666666', LIGHT = '#8a8a8a';

    /* 「客户联」黑标签 */
    ctx.fillStyle = '#111111';
    ctx.fillRect(PAD - 8, 34, 122, 40);
    ctx.fillStyle = '#ffffff';
    setFont(ctx, 21, 'bold');
    ctx.fillText(isSale ? '客户联' : '供货商联', PAD + 12, 62);

    /* 店名 */
    ctx.fillStyle = BLACK;
    setFont(ctx, 44, 'bold');
    ctx.textAlign = 'center';
    ctx.fillText(String(db.settings.shopName || '水果批发').slice(0, 12), W / 2, 148);
    ctx.textAlign = 'left';

    var y = 202;

    function infoLine(label, value) {
      ctx.fillStyle = BLACK;
      setFont(ctx, 23, 'normal');
      ctx.fillText(label, PAD, y);
      ctx.fillText(value, PAD + 148, y);
      y += 46;
    }

    var tm = new Date(rec.createdAt || Date.now());
    var hh = ('0' + tm.getHours()).slice(-2);
    var mi = ('0' + tm.getMinutes()).slice(-2);
    var ss = ('0' + tm.getSeconds()).slice(-2);

    infoLine('收银时间：', rec.date + ' ' + hh + ':' + mi + ':' + ss);
    infoLine('单　　号：', billNo(rec));
    infoLine('客　　户：', String(rec.partyName || '散客').slice(0, 16));

    /* 原单明细 */
    y += 16;
    ctx.fillStyle = BLACK;
    setFont(ctx, 27, 'bold');
    ctx.fillText('原单明细', PAD, y);

    /* 表头（灰底） */
    y += 16;
    ctx.fillStyle = '#eceeed';
    ctx.fillRect(PAD - 4, y, R - PAD + 8, 58);
    ctx.fillStyle = GRAY;
    setFont(ctx, 20, 'normal');
    ctx.fillText('#', PAD + 12, y + 38);
    ctx.fillText('货品', PAD + 56, y + 38);
    ctx.textAlign = 'right';
    ctx.fillText('数量', 434, y + 38);
    ctx.fillText('单价', 552, y + 38);
    ctx.fillText('小计', R - 12, y + 38);
    ctx.textAlign = 'left';

    y += 58;

    var COL_QTY = 434, COL_PRICE = 552, COL_AMT = R - 12;

    items.forEach(function (it, i) {
      y += 58;
      ctx.fillStyle = BLACK;
      setFont(ctx, 21, 'normal');
      ctx.fillText(String(i + 1), PAD + 12, y);

      var name = String(it.name);
      while (ctx.measureText(name).width > 280 && name.length > 2) name = name.slice(0, -1);
      if (name !== String(it.name)) name = name.slice(0, -1) + '…';
      ctx.fillText(name, PAD + 56, y);

      ctx.textAlign = 'right';
      ctx.fillText(S.fmtNum(it.qty) + it.unit, COL_QTY, y);
      ctx.fillText(S.fmtNum(it.price), COL_PRICE, y);
      ctx.fillText(S.fmtNum(it.amount), COL_AMT, y);
      ctx.textAlign = 'left';
    });

    if (moreCount > 0) {
      y += 40;
      ctx.fillStyle = LIGHT;
      setFont(ctx, 19, 'normal');
      ctx.fillText('…… 另外 ' + moreCount + ' 种未显示', PAD + 56, y);
    }

    /* 合计：粗线 */
    y += 26;
    ctx.strokeStyle = '#111111';
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(PAD, y); ctx.lineTo(R, y); ctx.stroke();
    ctx.lineWidth = 1;

    y += 50;
    ctx.fillStyle = BLACK;
    setFont(ctx, 28, 'bold');
    ctx.fillText('合计', PAD, y);
    ctx.textAlign = 'right';
    ctx.fillText(S.fmtNum(rec.total), COL_AMT, y);
    ctx.textAlign = 'left';

    /* 成交金额 */
    y += 64;
    ctx.textAlign = 'right';
    ctx.fillStyle = BLACK;
    setFont(ctx, 42, 'bold');
    ctx.fillText('成交金额：' + S.fmtNum(rec.total) + '元', R - 8, y);

    y += 44;
    ctx.fillStyle = GRAY;
    setFont(ctx, 21, 'normal');
    var payWord = rec.paid >= rec.total - 0.004 ? '现结' : (rec.paid > 0.004 ? '部分现结' : '赊账');
    ctx.fillText('（付款方式：' + payWord + '）', R - 8, y);
    ctx.textAlign = 'left';

    /* 欠款 */
    var debt = S.round2(rec.total - rec.paid);
    var totalDebt = 0;
    if (rec.partyId) totalDebt = S.partyBalance(db, isSale ? 'customer' : 'supplier', rec.partyId);

    if (debt > 0.004) {
      y += 68;
      ctx.textAlign = 'right';
      ctx.fillStyle = BLACK;
      setFont(ctx, 27, 'normal');
      ctx.fillText('本单欠：' + S.fmtNum(debt) + '元', R - 8, y);
      ctx.textAlign = 'left';
    }
    if (rec.partyId && totalDebt > 0.004) {
      y += 56;
      ctx.textAlign = 'right';
      ctx.fillStyle = BLACK;
      setFont(ctx, 36, 'bold');
      ctx.fillText('总欠款：' + S.fmtNum(totalDebt) + '元', R - 8, y);
      ctx.textAlign = 'left';
    }

    /* 虚线 + 两端圆点 */
    y += 56;
    ctx.strokeStyle = '#333333';
    ctx.lineWidth = 2;
    ctx.setLineDash([9, 7]);
    ctx.beginPath(); ctx.moveTo(PAD, y); ctx.lineTo(R, y); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = '#333333';
    ctx.beginPath(); ctx.arc(PAD - 8, y, 5, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(R + 8, y, 5, 0, Math.PI * 2); ctx.fill();

    /* 店铺地址 */
    if (db.settings.address) {
      y += 48;
      ctx.fillStyle = GRAY;
      setFont(ctx, 22, 'normal');
      ctx.textAlign = 'center';
      ctx.fillText('店铺地址：' + String(db.settings.address).slice(0, 30), W / 2, y);
      ctx.textAlign = 'left';
    }

    /* 收款码 */
    if (qrImg) {
      y += 22;
      var qBox = 132, qy = y;
      var ratio = qrImg.width / qrImg.height;
      var qw = qBox, qh = qBox;
      if (ratio > 1) qh = qBox / ratio;
      else if (ratio < 1) qw = qBox * ratio;
      try {
        ctx.drawImage(qrImg, PAD + 4, qy, qw, qh);
        ctx.fillStyle = GRAY;
        setFont(ctx, 22, 'normal');
        ctx.fillText('长按二维码付款', PAD + qBox + 34, qy + 50);
        ctx.fillStyle = LIGHT;
        setFont(ctx, 18, 'normal');
        ctx.fillText(db.settings.phone ? '电话 ' + db.settings.phone : '', PAD + qBox + 34, qy + 92);
        y = qy + Math.max(qh, 92) + 10;
      } catch (e) {
        y = qy - 22 + 26;
      }
    } else {
      y += 26;
      var foot = db.settings.phone ? ('电话 ' + db.settings.phone) : '';
      if (db.settings.owner) foot = db.settings.owner + (foot ? '　' + foot : '');
      if (foot) {
        ctx.fillStyle = LIGHT;
        setFont(ctx, 19, 'normal');
        ctx.fillText(foot, PAD, y);
      }
    }

    /* 裁剪成实际高度 */
    var finalH = Math.ceil(y + 44);
    var out = document.createElement('canvas');
    out.width = W * SCALE;
    out.height = finalH * SCALE;
    out.getContext('2d').drawImage(tmp, 0, 0, W * SCALE, finalH * SCALE, 0, 0, W * SCALE, finalH * SCALE);
    return out;
  }

  function loadImage(src) {
    return new Promise(function (resolve, reject) {
      var img = new Image();
      img.onload = function () { resolve(img); };
      img.onerror = function () { reject(new Error('图片加载失败')); };
      img.src = src;
    });
  }

  function openBill(recId) {
    var rec = null;
    for (var i = 0; i < db.records.length; i++) if (db.records[i].id === recId) rec = db.records[i];
    if (!rec) return;

    function paint(qrImg) {
      var canvas;
      try {
        canvas = buildBillCanvas(rec, qrImg);
      } catch (e) {
        toast('生成账单失败：' + e.message);
        return;
      }
      openSheet({
        title: '开单 · ' + (rec.partyName || '散客'),
        body: '<img id="billImg" class="bill-preview" alt="账单">' +
          '<div class="bill-hint">点下面 <b>分享</b> → 选 <b>微信</b> → 选好友<br/>或者长按图片 →「存储到照片」再发</div>',
        foot: '<button class="btn-ghost" data-act="copy-bill" data-id="' + rec.id + '">复制文字</button>' +
          '<button class="btn-primary" data-act="share-bill" data-id="' + rec.id + '">分享</button>',
        after: function () {
          canvas.toBlob(function (blob) {
            if (!blob) return;
            ui.billBlob = blob;
            var img = $('#billImg');
            if (img) img.src = URL.createObjectURL(blob);
          }, 'image/png');
        }
      });
    }

    if (db.settings.qr) {
      loadImage(db.settings.qr).then(paint).catch(function () { paint(null); });
    } else {
      paint(null);
    }
  }

  function shareBill(recId) {
    var blob = ui.billBlob;
    if (!blob) { toast('图片还没准备好，稍等一下'); return; }

    var rec = null;
    for (var i = 0; i < db.records.length; i++) if (db.records[i].id === recId) rec = db.records[i];
    var text = rec ? billText(rec) : '';

    var file = null;
    try {
      file = new File([blob], '账单.png', { type: 'image/png' });
    } catch (e) { file = null; }

    if (file && navigator.canShare && navigator.canShare({ files: [file] })) {
      navigator.share({
        files: [file],
        title: '销售单',
        text: text
      }).catch(function () {});
      return;
    }
    if (navigator.share) {
      navigator.share({ title: '销售单', text: text }).catch(function () {});
      return;
    }
    toast('这个浏览器不支持分享，长按图片存到相册再发');
  }

  function copyBill(recId) {
    var rec = null;
    for (var i = 0; i < db.records.length; i++) if (db.records[i].id === recId) rec = db.records[i];
    if (!rec) return;
    var text = billText(rec);

    function fallback() {
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); toast('账单文字已复制，去微信粘贴'); }
      catch (e) { toast('复制失败，请手动选择文字'); }
      document.body.removeChild(ta);
    }

    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () {
        toast('账单文字已复制，去微信粘贴');
      }).catch(fallback);
    } else {
      fallback();
    }
  }
